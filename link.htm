<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Directory</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <style>
        /* Base Page Configurations */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Layout Container */
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Header Title Styling */
        .container h1 {
            font-size: 2.5em;
            margin-bottom: 0.8em;
            color: #8A2BE2; /* Matches your --purple CSS variable */
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        /* Pill Link Buttons */
        .link {
            display: block;
            margin: 12px 0;
            padding: 12px 24px;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1em;
            
            /* High-Drip Gradient: Mapped from your theme variables */
            background: linear-gradient(45deg, #8A2BE2, #ff007f); 
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            
            /* Smooth flip animations */
            transition: all 0.4s ease;
        }

        /* Hover Interactive Effects */
        .link:hover {
            /* Flips the gradient direction and adds a neon pulse glow */
            background: linear-gradient(45deg, #ff007f, #8A2BE2);
            box-shadow: 0 0 15px #ff007f, 0 0 25px #8A2BE2;
            transform: translateY(-2px); /* Subtle click-me lift */
        }
    </style>
</head>
